events {}

http {
  # Upstreams resolve by service name on the compose network
  upstream keycloak_upstream { server keycloak:8080; }
  upstream beaver_upstream   { server cloudbeaver:8978; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Keycloak under /keycloak ---
    # Because KC_HTTP_RELATIVE_PATH=/keycloak, we keep that prefix for the upstream too
    location /keycloak/ {
      proxy_pass http://keycloak_upstream/keycloak/;  # trailing slash matters
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # --- CloudBeaver under /beaver ---
    # Case A: CloudBeaver serves at "/" (no context path) → strip "/beaver/" before proxying
    location /beaver/ {
      rewrite ^/beaver/(.*)$ /$1 break;
      proxy_pass http://beaver_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Case B (preferred if supported): if you set SERVER_SERVLET_CONTEXT_PATH=/beaver
    # in the CloudBeaver container, then replace the block above with:
    #
    # location /beaver/ {
    #   proxy_pass http://beaver_upstream/beaver/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection $connection_upgrade;
    # }
  }
}
